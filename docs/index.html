<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>monster-ascii</title>
<style>body{margin:0;background:#07121d;color:#d5e8f5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px}h1{color:#58b5f2}label{display:inline-block;margin:8px}input,select{background:#142c40;color:white;padding:8px;border:1px solid #36566c}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}article{padding:20px;background:#102333;border-radius:12px}.logo{height:230px;display:flex;align-items:center;justify-content:center}a{color:#58b5f2}</style>
<main><h1>monster-ascii</h1><p>Selectable ASCII. Solid 3D. Zero runtime dependencies.</p><label>Columns <input id="width" type="range" min="30" max="100" value="60"></label><label>Speed <input id="speed" type="range" min="0" max="3" step=".1" value="1"></label><label>Color <select id="color"><option value="#0071bc">Monstertov blue</option><option value="#58b5f2">Light blue</option><option value="gradient">Gradient</option><option value="brightness">Brightness</option></select></label><label>Ramp <select id="ramp"><option> .,:;irsXA253hMHGS#9B&amp;@</option><option> .:-=+*#%@</option><option> .oO@</option></select></label><section id="effects"></section><p><a href="../README.md">Source and documentation</a></p></main>
<script type="module">
import {mount} from '../src/web.js';import {effects} from '../src/core.js';
const handles=[];for(const effect of effects){const article=document.createElement('article'),title=document.createElement('h2'),logo=document.createElement('div');title.textContent=effect;logo.className='logo';logo.dataset.effect=effect;article.append(title,logo);document.querySelector('section').append(article);handles.push(await mount(logo,'./logo.svg',{effect}));}
for(const id of ['width','speed','color','ramp'])document.getElementById(id).addEventListener('input',()=>{const o={width:+document.getElementById('width').value,speed:+document.getElementById('speed').value,color:document.getElementById('color').value,ramp:document.getElementById('ramp').value};if(o.color==='gradient')o.color=['#0071bc','#b4e2ff'];handles.forEach(h=>h.update(o));});
</script></html>
