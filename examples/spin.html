<!doctype html>
<!-- A plain page with a spinning M. Serve the repository over HTTP, then open this file. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinning M</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f6fa; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1118; } }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); }
  #m { width: min(92vw, 560px); height: min(92vw, 560px); display: flex; align-items: center; justify-content: center; }
</style>
<div id="m" role="img"></div>
<script type="module">
  import { mount, textMask } from '../src/web.js';
  mount(document.querySelector('#m'), textMask('M'), {
    width: 80, rotation: 'spinY', color: '#0071bc', fontSize: 'fit', label: 'A spinning letter M'
  });
</script>
</html>
